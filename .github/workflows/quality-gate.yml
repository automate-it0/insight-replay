name: Quality Gate

# The merge gate. This workflow runs AFTER the CI workflow finishes, and
# verifies that the CI workflow itself succeeded — which transitively means
# lint (incl. the console.log hygiene check), type-check, and test were all
# green on that exact commit.
#
# In GitHub branch protection, set "Quality Gate / quality-gate" as a required
# status check. Because this job only passes when CI also passed, it
# transitively enforces lint + test (+ the console.log hygiene rule, which
# runs as a step of CI's lint job) before merge.
#
# Security note: this workflow deliberately performs NO checkout. A
# `workflow_run` event runs in the context of the target repository (with
# access to repository secrets), so it must never check out or execute code
# from the incoming ref. All code inspection happens in the CI workflow's
# `pull_request` / `push` context, which is the standard safe place for it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  quality-gate:
    name: quality-gate
    # Only run if the CI workflow concluded. If CI failed, this gate still runs
    # but fails immediately — that way the PR shows a red Quality Gate check
    # rather than a missing one.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify CI workflow succeeded
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            const runHtmlUrl = run.html_url;
            // A workflow_run event can be triggered from a fork. Never gate
            // on (or trust results from) a run that originated outside THIS
            // repository.
            const headRepo = run.head_repository.full_name;
            const thisRepo = context.payload.repository.full_name;
            if (headRepo !== thisRepo) {
              core.setFailed(
                `Refusing to gate a workflow_run from another repository ` +
                `(head repo: ${headRepo}, expected ${thisRepo}).`
              );
            } else if (run.conclusion !== 'success') {
              core.setFailed(
                `CI workflow on ${headSha} did not succeed (conclusion: ${run.conclusion}).` +
                ` See: ${runHtmlUrl}` +
                ` — Quality Gate cannot pass until lint, type-check, and test are all green.`
              );
            } else {
              core.info(`CI workflow on ${headSha} from ${headRepo} succeeded. Quality gate passed.`);
            }
