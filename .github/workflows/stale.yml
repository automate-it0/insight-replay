# Stale — auto-close inactive issues + PRs to keep the backlog healthy.

name: Stale

on:
  schedule:
    # Daily at 03:00 Africa/Cairo (01:00 UTC)
    - cron: "0 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark + close stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,help wanted,good first issue,roadmap,needs-triage"
          exempt-pr-labels: "pinned,security,WIP"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: |
            This issue has been inactive for 60 days and is being marked as stale.
            It will be closed in 14 days unless there's new activity. If this is
            still relevant, leave a comment saying **"keep"** and a maintainer will un-stale it. 💚
          stale-pr-message: |
            This PR has been inactive for 60 days and is being marked as stale.
            It will be closed in 14 days unless there's new activity. If you're
            still working on it, leave a comment. 💚
          close-issue-message: |
            Closing as stale. Please reopen if you're still seeing the issue
            on the latest version. 💚
          close-pr-message: |
            Closing as stale. Please reopen if you want to continue this work.
            Rebased PRs are most welcome. 💚
