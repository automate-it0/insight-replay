name: Security

# Security scan — runs on every push to main, on PRs to main, and weekly on
# Sunday 00:00 UTC as a backstop for new CVEs that ship after a PR landed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # weekly Sunday 00:00 UTC

permissions:
  contents: read
  security-events: write  # required for CodeQL + Semgrep SARIF uploads to code scanning

# Cancel in-flight runs of the same workflow when a new commit lands on the
# same ref. PR runs are cancelled; scheduled/main runs are allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Job 1: Dependency audit ----------------------------------------------
  audit-deps:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.0"

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun audit` exits non-zero if any vulnerability is found.
      - name: bun audit
        run: bun audit

  # --- Job 2: Secrets scan --------------------------------------------------
  # TruffleHog scans the full git history for leaked secrets/API keys.
  secrets-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Need full history so TruffleHog can scan every commit, not just HEAD.
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pinned to an exact release commit SHA — was @main (supply-chain
        # risk: any malicious commit on the upstream default branch would
        # run in CI).
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # Scan the working tree + all branches in this checkout.
          path: .
          extra_args: --only-verified

  # --- Job 3: SAST (Semgrep) -----------------------------------------------
  # Static analysis with Semgrep community rulesets. Uploads SARIF findings
  # to GitHub's code-scanning UI (alongside CodeQL). Covers TS/JS + Next.js/
  # React + OWASP Top-10 + Node.js-specific patterns.
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The `returntocorp/semgrep-action@v1` wrapper pins a 2022-era Docker
      # image that no longer writes a SARIF file, so the upload step failed
      # with "Path does not exist: semgrep.sarif". Run the official
      # `semgrep/semgrep` image directly instead — it writes the SARIF into
      # the mounted workspace, and the output path is explicit.
      - name: Semgrep scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep:latest \
            semgrep scan \
              --config p/typescript \
              --config p/javascript \
              --config p/react \
              --config p/nextjs \
              --config p/owasp-top-ten \
              --sarif \
              --output /src/semgrep.sarif \
              --metrics=off \
              --exclude node_modules \
              --exclude .next
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- Job 4: SAST (CodeQL) -----------------------------------------------
  # GitHub-native SAST. `init` builds the language database, `analyze` runs
  # the security queries and uploads results to code scanning. JS/TS is an
  # interpreted language so no autobuild step is required between them.
  codeql-sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # security-extended = default suite + extra security queries.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
