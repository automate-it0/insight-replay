name: CI

# CI pipeline for Insight Replay.
# Shift-Left: catch lint / type / test / build issues in CI, never in production.
# Faster-is-Safer: 4 jobs run in parallel; old runs on the same branch are cancelled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — frees runners + keeps PR signal clean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: `timeout-minutes` is a JOB-level setting only — GitHub Actions
# rejects the whole workflow file with "Unexpected value 'timeout-minutes'"
# if it appears at the top level. Each job below sets its own budget.

jobs:
  # --- Job 1: Lint -----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `cache:` input on purpose: this project resolves dependencies
        # with bun (bun.lock) and ships no npm/yarn lockfile, so setup-node
        # cannot compute an npm cache key and the step would fail with
        # "Dependencies lock file is not found".

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      # Production code lives under src/ (app code) and mini-services/ (live
      # socket.io service). Tests and scripts are allowed to use console.log.
      # Allow-list: anything under tests/, scripts/, .github/, docs/, examples/.
      # This check runs here — in the pull_request/push context — so the
      # privileged workflow_run Quality Gate never has to check out code.
      - name: Check for console.log in production source
        run: |
          set -euo pipefail
          matches=$(grep -rnE "console\.log" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules \
            src/ mini-services/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Found console.log calls in production source:"
            echo "$matches"
            echo ""
            echo "Remove them or replace with the structured logger in src/lib/observability.ts"
            exit 1
          else
            echo "No console.log calls found in src/ or mini-services/."
          fi

  # --- Job 2: Type-check -----------------------------------------------------
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `cache:` input on purpose: this project resolves dependencies
        # with bun (bun.lock) and ships no npm/yarn lockfile, so setup-node
        # cannot compute an npm cache key and the step would fail with
        # "Dependencies lock file is not found".

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tsc --noEmit` resolves the generated Prisma client types. Without
      # this step the type-check fails with "Module '@prisma/client' has no
      # exported member 'PrismaClient'".
      - name: Generate Prisma client
        run: bun run db:generate

      # The socket.io live service is a standalone package with its own
      # package.json + bun.lock. Its dependencies must be present for the
      # root type-check to resolve the `socket.io` types.
      - name: Install live-service dependencies
        working-directory: mini-services/live-service
        run: bun install --frozen-lockfile

      # next.config.ts has typescript.ignoreBuildErrors: true, so `next build`
      # would happily ship broken types. `tsc --noEmit` is the real gate.
      - name: Run tsc --noEmit
        run: bunx tsc --noEmit

  # --- Job 3: Test -----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `cache:` input on purpose: this project resolves dependencies
        # with bun (bun.lock) and ships no npm/yarn lockfile, so setup-node
        # cannot compute an npm cache key and the step would fail with
        # "Dependencies lock file is not found".

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # api-contracts.test.ts auto-skips if the dev server is unreachable,
      # so CI runs cleanly without booting a server.
      - name: Run tests
        run: bun test --coverage tests/

  # --- Job 4: Build (only on push to main) ----------------------------------
  # PRs skip the slow `next build` step to keep feedback fast. The lint + test
  # jobs above already gate PRs; build runs on merge to main as a final safety net.
  build:
    name: Build
    needs: [lint, type-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma needs a writable DATABASE_URL or it refuses to instantiate.
      # Use a throwaway SQLite file in /tmp — we're only validating the build,
      # not running migrations against real data.
      DATABASE_URL: file:/tmp/test.db
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `cache:` input on purpose: this project resolves dependencies
        # with bun (bun.lock) and ships no npm/yarn lockfile, so setup-node
        # cannot compute an npm cache key and the step would fail with
        # "Dependencies lock file is not found".

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Cache .next/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('**/*.ts', '**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      # `next build` runs the app's boot-time secret assertions (see
      # src/lib/startup.ts, src/lib/session.ts and src/lib/crypto.ts). Under
      # production NODE_ENV the server refuses to start unless BOTH
      # SESSION_SECRET (cookie HMAC) and ENCRYPTION_KEY (field encryption)
      # are set to strong, non-placeholder values — >= 16 chars spanning all
      # four character classes. These are throwaway values generated for
      # this build only: they never reach a deployed environment, and the
      # suffixes guarantee the character classes regardless of what openssl
      # happens to emit.
      - name: Generate build-time secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')Aa1!" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 48 | tr -d '\n')Bb2@" >> "$GITHUB_ENV"
          echo "ADMIN_TOKEN=$(openssl rand -base64 32 | tr -d '\n')Cc3#" >> "$GITHUB_ENV"
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build
