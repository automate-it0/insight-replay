version: 2
updates:
  # The repo is managed by Bun (bun.lock, no package-lock.json) — the npm
  # ecosystem cannot update bun.lock and Dependabot errors out. Use the
  # "bun" ecosystem so version updates actually apply to the lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
